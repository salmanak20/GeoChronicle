[project]
name = "geochronicle-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2,<3", "alembic>=1.14,<2"]
[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
